        delay_scale_s: 4.5e-11 # prompt里会以delay_scale_s * 0.7 作为目标值，reward会以delay_scale_s作为0.6分delay分数基准
        power_scale_W: 2.7e-6 # prompt里会以power_scale_W * 0.7 作为目标值，reward会以power_scale_W作为0.6分power分数基准
